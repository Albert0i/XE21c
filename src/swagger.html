<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YRunner API Docs</title>
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist/swagger-ui.css">
</head>
<body>
  <div id="swagger-ui"></div>

  <!-- Custom footer -->
    <footer style="background:#f0f0f0; color:#000; text-align:center; padding:10px; margin-top:20px;">
    © 2026 All Rights Reserved. Built with help from 
    <a href="https://copilot.microsoft.com/" target="_blank" style="color:#000; text-decoration:underline;">
        Microsoft Copilot
    </a>
    </footer>


  <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function() {
      SwaggerUIBundle({
        url: '/swagger.json',   // serve your spec here
        dom_id: '#swagger-ui',
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: "BaseLayout"
      });
    };
  </script>
</body>
</html>
