
events { worker_connections 1024; }

http {
    # Round-Robin loop configuration targeting our container endpoints
    upstream api_gateway_servers {
        server oracle-db-api-gateway-1:3000;
        server oracle-db-api-gateway-2:3000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://api_gateway_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
