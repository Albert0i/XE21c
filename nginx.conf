
events { worker_connections 1024; }

http {
    upstream api_gateway_servers {
        server oracle-db-api-gateway-1:3000;
        server oracle-db-api-gateway-2:3000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://api_gateway_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 🔥 New: Expose NGINX basic status tracking internally
        location /nginx_status {
            stub_status on;
            allow 127.0.0.1;
            allow 172.16.0.0/12; # Allows docker networks to scrape it
            deny all;
        }
    }
}
