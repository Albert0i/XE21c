#version: "3.8"

services:
  oracle-db:
    image: ${ORACLE_IMAGE_NAME}
    container_name: ${ORACLE_CONTAINER_NAME}
    ports:
      - "${ORACLE_PORT}:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_ROOT_PASSWORD}
      ORACLE_DATABASE: ${ORACLE_DATABASE}
      APP_USER: ${ORACLE_APP_USER}
      APP_USER_PASSWORD: ${ORACLE_APP_USER_PASSWORD}
    volumes:
      - ${ORACLE_DATA_DIR}:/opt/oracle/oradata
      # Map your initialization script safely
      - ./init.sql:/container-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10

  oracle-exporter:
    image: iamseth/oracledb_exporter:latest
    container_name: oracle-exporter
    environment:
      # Connects using system admin credentials to scrape global database activity
      DATA_SOURCE_NAME: "oracle://system:${ORACLE_ROOT_PASSWORD}@oracle-db:1521/${ORACLE_DATABASE}"
    ports:
      - "9161:9161"
    links:
      - oracle-db:oracle-db
    depends_on:
      oracle-db:
        condition: service_healthy
    restart: unless-stopped
    # http://localhost:9161/metrics

  prometheus:
    image: prom/prometheus:latest
    container_name: oracle-prometheus
    user: "1000:1000"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus_data:/prometheus
    ports:
      - "9091:9090"  # <-- Explicitly mapped to 9091 to avoid host port allocation conflicts
    depends_on:
      - oracle-exporter
    restart: unless-stopped
    # http://localhost:9091/targets

  grafana:
    image: grafana/grafana:latest
    container_name: oracle-grafana
    user: "1000:1000"
    ports:
      - "8080:3000"  # <-- Changed host port from 3000 to 8080
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./data/grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    # http://localhost:8080/
    # Dashboard id: 13555
    

  # oracle-db-api-gateway:
  #   image: albert0i/oracle-db-api-gateway:1.0
  #   container_name: oracle-db-api-gateway
  #   build:
  #     context: . # Ensures Docker reads from root (access to ./tool and ./src)
  #     dockerfile: Dockerfile
  #   ports:
  #     - "${API_PORT}:3000"
  #   env_file:
  #     - .env # Injects credentials directly into container memory securely
  #   environment:
  #     - ORACLE_HOST=oracle-db  # 2. OVERRIDES 'localhost' with the internal Docker service name
  #     - NODE_OPTIONS=--no-deprecation  # Silences the url.parse() warning    
  #   depends_on:
  #     oracle-db:
  #       condition: service_healthy    
  #   restart: always
  
  # Instance 1: Dedicated first worker gateway
  oracle-db-api-gateway-1:
    image: albert0i/oracle-db-api-gateway:1.0
    container_name: oracle-db-api-gateway-1
    build:
      context: .
      dockerfile: Dockerfile
    # Exposed to internal network only, remove host ports mapping to avoid conflicts
    env_file:
      - .env
    environment:
      - ORACLE_HOST=oracle-db  
      - NODE_OPTIONS=--no-deprecation  
    depends_on:
      oracle-db:
        condition: service_healthy    
    restart: always

  # Instance 2: Dedicated second worker gateway
  oracle-db-api-gateway-2:
    image: albert0i/oracle-db-api-gateway:1.0
    container_name: oracle-db-api-gateway-2
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - ORACLE_HOST=oracle-db  
      - NODE_OPTIONS=--no-deprecation  
    depends_on:
      oracle-db:
        condition: service_healthy    
    restart: always

  # Load Balancer: NGINX distributes traffic between Instance 1 and Instance 2
  api-gateway-load-balancer:
    image: nginx:alpine
    container_name: api-gateway-load-balancer
    ports:
      - "${API_PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - oracle-db-api-gateway-1
      - oracle-db-api-gateway-2
    restart: always

  # 🔥 New: Scrapes statistics from NGINX on port 80 and reformats them
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter
    command:
      - "-nginx.scrape-uri=http://api-gateway-load-balancer/nginx_status"
    ports:
      - "9113:9113"
    depends_on:
      - api-gateway-load-balancer
    restart: always

  # DBeaver
  dbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: dbeaver-web
    ports:
      - "8979:8978"
    volumes:
      # FOLDER CREATION: Docker automatically generates './data/dbeaver_data' on your host.
      # PERMISSIONS: Auto-mapped on Windows/Mac. CloudBeaver runs internally as UID 1001.
      # LINUX FIX: If the app crashes with a write-permission block on Linux, run:
      # sudo mkdir -p ./dbeaver_data && sudo chown -R 1001:1001 ./dbeaver_data
      - ./data/dbeaver_data:/opt/cloudbeaver/workspace
    depends_on:
      oracle-db:
        condition: service_healthy
    restart: always
